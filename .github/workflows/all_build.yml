name: Build All

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  build_windows_x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        id: win-deps-x64
        with:
          path: windows/deps
          key: win-deps-x64-${{ hashFiles('windows/build_deps.ps1') }}

      - name: Set up Python 3.13
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install mako
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        run: pip install mako

      - name: Add msbuild to PATH
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Setup VS Dev Env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Deps
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        shell: powershell
        working-directory: ${{github.workspace}}\windows
        run: ${{github.workspace}}\windows\build_deps.ps1

      # - name: Add support to NSIS for long PATHs
      #   shell: powershell
      #   run: ${{github.workspace}}\windows\Get-NSIS-LongStrings.ps1

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        working-directory: ${{runner.workspace}}/build
        run: cmake -G Ninja -DCMAKE_FIND_ROOT_PATH=${{github.workspace}}/windows/deps/output -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/windows/deps/output -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_PROCESSOR=AMD64 "$Env:GITHUB_WORKSPACE"

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: ninja

      - name: Build Installer
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cpack -C $BUILD_TYPE

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_x64_Installer
          path: ${{runner.workspace}}/build/SatDump-*.exe

      - name: Add dumpbin to PATH
        run: echo "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\$((Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).Name)\bin\Hostx64\x64" >> $env:GITHUB_PATH

      - name: Build Portable
        shell: powershell
        working-directory: ${{runner.workspace}}/build
        run: ${{github.workspace}}\windows\make_portable.ps1 -source_path "$Env:GITHUB_WORKSPACE"

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_x64_Portable
          path: ${{runner.workspace}}/build/portable/*
